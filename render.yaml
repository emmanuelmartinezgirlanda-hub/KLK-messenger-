# Servidor de KLK messenger en Render (https://render.com): "New → Blueprint" y elige este repositorio.
# Planes de pago: servidor Starter (7 $/mes, no se duerme) y base de datos
# Basic 256 MB (6 $/mes, no caduca). El plan gratis borra la base de datos a los 30 días.
services:
  - type: web
    name: klk-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: klk-db
          property: connectionString
      - key: KLK_TRUST_PROXY
        value: "1"
      # Twilio Verify: los valores se escriben en el panel de Render (nunca en el código).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_VERIFY_LOCALE
        value: es
      # Clave del panel del dueño (https://klk-server.onrender.com/admin).
      # Render la inventa sola; la ves en klk-server → Environment.
      - key: KLK_ADMIN_TOKEN
        generateValue: true
      # Precio de cada SMS y coste mensual del servidor (euros), para el panel.
      - key: KLK_SMS_PRICE
        value: "0.08"
      - key: KLK_SERVER_COST
        value: "12"
      # Recargas a RD: APAGADAS hasta el lanzamiento (la app dice "Pronto").
      # "1" = modo prueba (no se cobra nada). Para las de verdad se añaden en Render
      # las claves de Reloadly y Stripe.
      # Números de prueba para la revisión de Apple/Google: no reciben SMS y entran
      # con el código fijo KLK_REVIEW_CODE (se escribe en Render, no aquí).
      - key: KLK_REVIEW_PHONES
        value: "+12025550147,+12025550148"
      - key: KLK_REVIEW_CODE
        sync: false
      - key: KLK_TOPUP_DEMO
        value: "0"
      - key: RELOADLY_CLIENT_ID
        sync: false
      - key: RELOADLY_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Notificaciones push de iPhone (avisos con la app cerrada).
      # APNS_KEY = contenido del archivo AuthKey_XXXXXXXXXX.p8 de Apple Developer.
      - key: APNS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_TOPIC
        value: com.klkapp.klk

databases:
  - name: klk-db
    plan: basic-256mb
