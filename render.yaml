# Servidor de KLK messenger en Render (https://render.com): "New → Blueprint" y elige este repositorio.
# El plan gratuito sirve para pruebas (el servidor se duerme tras 15 min sin uso
# y la base de datos gratuita caduca a los 30 días).
services:
  - type: web
    name: klk-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: klk-db
          property: connectionString
      - key: KLK_TRUST_PROXY
        value: "1"
      # Twilio Verify: los valores se escriben en el panel de Render (nunca en el código).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_VERIFY_LOCALE
        value: es

databases:
  - name: klk-db
    plan: free
