# Servidor de KLK messenger en Render (https://render.com): "New → Blueprint" y elige este repositorio.
# El plan gratuito sirve para pruebas (el servidor se duerme tras 15 min sin uso
# y la base de datos gratuita caduca a los 30 días).
services:
  - type: web
    name: klk-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: klk-db
          property: connectionString
      - key: KLK_TRUST_PROXY
        value: "1"
      # Para SMS reales, añade en el panel de Render:
      #   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM

databases:
  - name: klk-db
    plan: free
