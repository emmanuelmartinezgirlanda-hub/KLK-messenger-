name: klk
description: "KLK — La app de mensajería que conecta a los dominicanos en todo el mundo."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Base de datos local cifrada (SQLCipher, AES-256)
  sqflite_sqlcipher: ^3.0.0
  path: ^1.9.0

  # Claves en Keychain (iOS) / Keystore (Android)
  flutter_secure_storage: ^9.2.4

  # Red
  http: ^1.2.2
  web_socket_channel: ^3.0.2

  # Cifrado provisional (ver lib/core/crypto/README.md)
  cryptography: ^2.7.0

  # Multimedia: fotos, vídeos, notas de voz, documentos y ubicación
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: ">=8.1.2 <11.0.0"
  record: ">=5.1.2 <7.0.0"
  just_audio: ">=0.9.40 <0.11.0"
  video_player: ^2.9.2
  geolocator: ">=13.0.0 <15.0.0"
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  flutter_contacts: ^2.6.0  # 2.x ya usa UIScene (la 1.x se cerraba al abrir en iOS 27)

  # Traductor dentro del móvil (sin enviar los mensajes a ningún servidor)
  google_mlkit_translation: ">=0.11.0 <1.0.0"
  google_mlkit_language_id: ">=0.11.0 <1.0.0"

  # Llamadas de voz y vídeo (WebRTC: cifrado DTLS-SRTP de móvil a móvil)
  flutter_webrtc: ">=0.12.0 <2.0.0"

  # Bloqueo con Face ID / Touch ID / código del móvil
  local_auth: ">=2.3.0 <3.0.0"

  # Guardar la copia de seguridad cifrada en Archivos / iCloud Drive
  share_plus: ">=10.0.0 <11.0.0"

  # Funciones nativas propias: notas de voz a texto en el móvil y aviso de capturas
  klk_native:
    path: packages/klk_native

  # Utilidades
  google_fonts: ^6.2.1
  intl: any   # la versión la fija flutter_localizations
  uuid: ^4.5.1
  timezone: ">=0.9.4 <0.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/stickers/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/klk_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#002D62"
  adaptive_icon_foreground: "assets/icon/klk_icon_foreground.png"
