name: klk_native
description: "Funciones nativas de KLK: notas de voz a texto en el propio iPhone y aviso de capturas de pantalla."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: KlkNativePlugin
