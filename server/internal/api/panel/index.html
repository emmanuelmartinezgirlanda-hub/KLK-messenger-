<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Servidor KLK messenger</title>
<style>
:root{
  color-scheme:dark;
  --bg:#06102A; --bg2:#0A1838; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --ink:#EAF0FF; --muted:#8F9DC2; --soft:#C3CDE6;
  --red:#FF3D57; --blue:#4C8DFF; --ok:#25D9A8; --warn:#FFB547;
  --okbg:rgba(37,217,168,.12); --warnbg:rgba(255,181,71,.13); --badbg:rgba(255,61,87,.13); --chip:rgba(76,141,255,.14);
  --shadow:0 20px 50px -24px rgba(0,0,0,.7);
  --round:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display",system-ui,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: light){:root{
  color-scheme:light;
  --bg:#EEF2FA; --bg2:#E3E9F6; --panel:#FFFFFF; --panel2:#F4F6FC; --line:#DCE3F1; --ink:#0B1B3F; --muted:#5B6886; --soft:#33405E;
  --red:#CE1126; --blue:#0B4DB8; --ok:#0A9A6F; --warn:#B26B00;
  --okbg:#E3F7EF; --warnbg:#FFF4DF; --badbg:#FDE8EB; --chip:#E6EEFD; --shadow:0 18px 40px -26px rgba(11,27,63,.35);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(1200px 600px at 110% -10%,rgba(206,17,38,.22),transparent 60%),
             radial-gradient(900px 600px at -20% 30%,rgba(0,45,98,.55),transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme: light){body{background:radial-gradient(900px 500px at 110% -10%,rgba(206,17,38,.10),transparent 60%),radial-gradient(900px 600px at -20% 30%,rgba(11,77,184,.10),transparent 60%),var(--bg)}}
button,input,textarea{font:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Marco ---------- */
.shell{display:block;min-height:100vh}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line)}
header .logo{width:40px;height:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(206,17,38,.35))}
header h1{margin:0;flex:1;min-width:0;font:800 19px/1.15 var(--round);letter-spacing:-.01em}
header h1 small{display:block;font:500 12.5px/1.3 system-ui,sans-serif;color:var(--muted);letter-spacing:0}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.iconbtn:hover{background:var(--panel2)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.spin svg{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}

nav{position:fixed;z-index:7;left:max(8px,calc(50% - 280px));right:max(8px,calc(50% - 280px));bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:2px;padding:5px;border-radius:24px;overflow-x:auto;scrollbar-width:none;
  background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--line);box-shadow:var(--shadow)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:46px;padding:8px 2px 7px;border:0;border-radius:18px;
  background:transparent;color:var(--muted);font:650 9.5px/1 system-ui,sans-serif;white-space:nowrap;cursor:pointer;position:relative;transition:background .2s,color .2s}
nav button svg{width:21px;height:21px}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
nav .badge{position:absolute;top:3px;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:999px;font:800 10px/1 system-ui;padding:3px 5px;box-shadow:0 0 0 2px var(--bg2)}
main{width:100%;max-width:980px;margin:0 auto;padding:18px 14px calc(110px + env(safe-area-inset-bottom))}

@media (min-width:900px){
  .shell{display:grid;grid-template-columns:232px 1fr}
  .side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
  nav{position:static;flex-direction:column;gap:4px;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-width:none;overflow:visible;border-radius:0}
  nav button{flex:none;flex-direction:row;gap:12px;min-width:0;padding:11px 14px;border-radius:14px;font-size:14.5px;justify-content:flex-start}
  nav button:hover{background:var(--panel)}
  nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
  nav .badge{position:static;margin-left:auto;box-shadow:none}
  main{padding:26px 28px 60px}
  header{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:0;padding:26px 28px 0;position:static;max-width:980px;margin:0 auto;width:100%}
  .side .brand{display:flex;align-items:center;gap:10px;font:800 17px/1.2 var(--round);padding:0 6px}
  .side .brand img{width:38px}
  header .logo{display:none}
}
@media (max-width:899px){.side .brand{display:none}}

/* ---------- Piezas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
h2{font:750 17px/1.3 var(--round);letter-spacing:-.01em;margin:28px 2px 12px;display:flex;align-items:baseline;gap:8px}
h2 .muted{font:500 13px system-ui,sans-serif}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:15px 16px}
.stat b{font:800 30px/1.1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.hl b{color:var(--red)}
.stat .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px;background:var(--chip);color:var(--blue)}
.stat .ico svg{width:17px;height:17px}

/* El pulso: lo único llamativo del panel */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px 20px 14px;border:1px solid var(--line);
  background:linear-gradient(155deg,#0E2A66 0%,#081A44 55%,#2A0B22 100%);color:#fff;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,61,87,.35),transparent 65%);pointer-events:none}
.hero .live{display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px;color:#BFD0FF}
.hero .live i{width:9px;height:9px;border-radius:50%;background:#25D9A8;box-shadow:0 0 0 0 rgba(37,217,168,.7);animation:beat 1.8s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(37,217,168,.65)}70%{box-shadow:0 0 0 12px rgba(37,217,168,0)}100%{box-shadow:0 0 0 0 rgba(37,217,168,0)}}
.hero .num{font:850 clamp(64px,17vw,112px)/.95 var(--round);letter-spacing:-.045em;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.hero .sub{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hero .pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:13px;color:#DCE5FF}
.hero .pill b{color:#fff}
.hero .area{margin:18px -20px -14px;position:relative}
.hero .area svg{display:block;width:100%;height:120px}
.area-wrap{position:relative}
.area-wrap .end{position:absolute;right:3px;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--red)}
.hero .area-wrap .end{border-color:#FF6F84;box-shadow:0 0 0 5px rgba(255,111,132,.25)}
.hero .area .x{position:absolute;left:20px;right:20px;bottom:8px;display:flex;justify-content:space-between;font-size:11px;color:#9FB2E6}
@media (prefers-reduced-motion:reduce){.hero .live i,.iconbtn.spin svg{animation:none}}

.area2 svg{display:block;width:100%;height:130px}
.area2 .x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

.bars .row{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:12px;padding:7px 0}
.bars .row span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .row div{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bars .row div i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--red))}
.bars .row b{text-align:right;font:750 14px var(--round);font-variant-numeric:tabular-nums}

.rep{margin-bottom:12px}
.rep .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:750;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--blue)}
.tag.spam{background:var(--warnbg);color:var(--warn)} .tag.acoso,.tag.estafa,.tag.ofensivo,.tag.bloqueo{background:var(--badbg);color:var(--red)}
.tag.done{background:var(--okbg);color:var(--ok)}
.msgs{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.msgs li{background:var(--panel2);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:14px;white-space:pre-wrap;word-break:break-word;max-width:520px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:var(--r-sm);padding:10px 15px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:transparent;color:#fff}
.btn.danger{background:var(--red);border-color:transparent;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;font-size:15px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px;color:var(--soft)}
.note{background:var(--chip);border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;margin:0}
.empty{text-align:center;padding:34px 12px;color:var(--muted)}
.list{padding:4px 16px}
.list .item{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0}
.list .item:first-child{border-top:0}
table{width:100%;border-collapse:collapse}
.money td{padding:10px 2px;border-bottom:1px solid var(--line)} .money tr:last-child td{border-bottom:0}
.money td:last-child{text-align:right;font:750 15px var(--round);font-variant-numeric:tabular-nums}

.svc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)} .svc:last-child{border-bottom:0}
.svc .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok);box-shadow:0 0 0 4px var(--okbg)}
.svc .dot.bad{background:var(--red);box-shadow:0 0 0 4px var(--badbg)}
.status{display:flex;align-items:center;gap:12px;border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;font-weight:700}
.status.ok{background:var(--okbg);color:var(--ok)} .status.bad{background:var(--badbg);color:var(--red)}
.status.warn{background:var(--warnbg);color:var(--warn);font-weight:600}
.form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.form input[type=checkbox]{width:auto}
.form input:not([type=checkbox]),.form select,#expRate{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.links a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;color:var(--ink);text-decoration:none;transition:border-color .2s,background .2s}
.links a:hover{border-color:var(--blue);background:var(--panel2)}
.links a b{display:block;font-size:15px} .links a span{display:block;font-size:13px;color:var(--muted);margin-top:2px}

/* ---------- Entrar ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
#login .card{width:100%;max-width:400px;padding:28px 24px;border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
#login .biglogo{display:block;width:120px;height:auto;margin:0 auto 14px;filter:drop-shadow(0 12px 26px rgba(206,17,38,.4))}
#login h1{margin:0 0 6px;font:800 24px/1.2 var(--round);text-align:center;letter-spacing:-.01em}
#login p{text-align:center}
.err{color:var(--red);font-weight:650;min-height:1.4em;margin:10px 0 0;text-align:center}
.check{display:flex;gap:9px;align-items:center;font-weight:550;margin-top:14px;color:var(--soft)}
.check input{width:18px;height:18px;accent-color:var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;z-index:9;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
</style>
</head>

  token="";try{localStorage.removeItem("klk_admin");sessionStorage.removeItem("klk_admin")}catch(e){}
  $("#app").hidden=true;$("#login").hidden=false;$("#loginErr").textContent=msg||"";
}

async function login(){
  token=$("#tok").value.trim();
  if(!token){$("#loginErr").textContent="Escribe la clave.";return}
  $("#enter").disabled=true;
  try{
    data.stats=await api("stats");
    try{($("#remember").checked?localStorage:sessionStorage).setItem("klk_admin",token)}catch(e){}
    $("#login").hidden=true;$("#app").hidden=false;$("#tok").value="";
    await loadAll();
  }catch(e){if(e.message!=="401")$("#loginErr").textContent=e.message}
  finally{$("#enter").disabled=false}
}

async function loadAll(){
  try{
    const [s,r,n,b,tp,g,sv,ex]=await Promise.all([api("stats"),api("reports"+(showAll?"?all=1":"")),api("announcements"),api("banned"),api("topups").catch(()=>({topups:[]})),api("gente").catch(()=>({posts:[]})),api("services").catch(()=>null),api("expenses").catch(()=>null)]);
    data.services=sv;if(ex&&!expEditing)data.expenses=ex;const pend=ex?ex.items.filter(i=>i.active&&i.amount==null).length:0;$("#expBadge").hidden=!pend;$("#expBadge").textContent=pend;const bad=sv?sv.checks.filter(c=>!c.ok).length:0;$("#svcBadge").hidden=!bad;$("#svcBadge").textContent=bad;
    data.stats=s;data.reports=r.reports;data.news=n.announcements;data.banned=b.accounts;data.topups=tp.topups||[];data.gente=g.posts||[];
    $("#updated").textContent="Actualizado "+new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
    const open=s.stats.openReports;$("#repBadge").hidden=!open;$("#repBadge").textContent=open;
    render();
  }catch(e){if(e.message!=="401")toast(e.message)}
}

// Curva de 30 días (SVG). [hero] = dentro del pulso (colores fijos sobre azul).
function chart(days,hero){
  const W=300,H=100,pad=8,n=days.length,max=Math.max(1,...days.map(d=>d.count));
  const pts=days.map((d,i)=>[i/(n-1||1)*W, H-pad-(d.count/max)*(H-pad*2.4)]);
  let line=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;line+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}
  const id="g"+Math.random().toString(36).slice(2,7), last=pts[pts.length-1];
  const stroke=hero?"#FF6F84":"var(--red)", top=hero?"rgba(255,111,132,.45)":"color-mix(in srgb,var(--red) 30%,transparent)";
  const f=s=>new Date(s+"T12:00:00Z").toLocaleDateString("es",{day:"numeric",month:"short"});
  const total=days.reduce((a,d)=>a+d.count,0);
  return `<div class="area-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${total} en 30 días; hoy ${days[n-1].count}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="transparent"/></linearGradient></defs>
    <path d="${line} L${W},${H} L0,${H}Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
  </svg><i class="end" style="top:${(last[1]/H*100).toFixed(1)}%"></i></div><div class="x"><span>${f(days[0].day)}</span><span>hoy · ${days[n-1].count}</span></div>`;
}

function genteBtn(msgs){
  const m=(msgs||[])[0]||"";
  let x=m.match(/^\[Mi Gente\] publicación ([0-9a-f-]{36})$/);
  if(x)return `<button class="btn danger" data-delpost="${esc(x[1])}">Borrar publicación</button>`;
  x=m.match(/^\[Mi Gente\] comentario ([0-9a-f-]{36})$/);
  if(x)return `<button class="btn danger" data-delcomment="${esc(x[1])}">Borrar comentario</button>`;
  return "";
}

var expEdit=null, expEditing=false;
const EVERY={month:"al mes",year:"al año",once:"una vez"};
function expEur(it,rate){if(it.amount==null)return 0;return it.currency==="USD"?it.amount*rate:it.amount}
function expMoney(v,cur){return (cur==="USD"?"US$ ":"")+(cur==="USD"?new Intl.NumberFormat("es",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v):eur.format(v))}
function renderGastos(){
  const d=data.expenses;
  if(!d)return `<div class="empty">No se pudieron cargar los gastos. Pulsa Actualizar.</div>`;
  const rate=d.usdToEur||0.9, act=d.items.filter(i=>i.active);
  const monthly=act.reduce((a,i)=>a+(i.every==="month"?expEur(i,rate):i.every==="year"?expEur(i,rate)/12:0),0);
  const yearly=act.reduce((a,i)=>a+(i.every==="month"?expEur(i,rate)*12:i.every==="year"?expEur(i,rate):0),0);
  const once=d.items.filter(i=>i.every==="once"&&i.paid).reduce((a,i)=>a+expEur(i,rate),0);
  const pend=act.filter(i=>i.amount==null);
  const sms=(data.stats&&data.stats.money)||{};
  const today=new Date().toISOString().slice(0,10), in60=new Date(Date.now()+60*864e5).toISOString().slice(0,10);
  const next=act.filter(i=>i.next&&i.next>=today&&i.next<=in60&&i.every!=="once").sort((a,b)=>a.next.localeCompare(b.next));
  const fd=x=>new Date(x+"T12:00:00Z").toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"});
  const row=i=>`<div class="item" style="${i.active?"":"opacity:.55"}"><div style="min-width:0"><b>${esc(i.name)}</b>${i.what?` <span class="muted small">· ${esc(i.what)}</span>`:""}
    <div class="muted small">${i.amount==null?'<b style="color:var(--warn)">Precio por confirmar</b>':`${expMoney(i.amount,i.currency)} ${EVERY[i.every]}${i.currency==="USD"?` · ≈ ${eur.format(expEur(i,rate))}`:""}`}${i.next?` · ${i.every==="once"?"pagado el":"próximo cobro"} ${fd(i.next)}`:""}${i.every==="once"&&i.paid?" · ✅ pagado":""}${i.active?"":" · cancelado"}${i.notes?`<br>${esc(i.notes)}`:""}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" data-exp-edit="${esc(i.id)}">Editar</button></div></div>`;
  const groups=[["month","Cada mes"],["year","Cada año"],["once","Pagos de una vez"]].map(([k,t])=>{const l=d.items.filter(i=>i.every===k);return l.length?`<h2>${t}</h2><div class="card list">${l.map(row).join("")}</div>`:""}).join("");
  return `<div class="grid">
    <div class="card stat hl"><b>${eur.format(monthly)}</b><span>pagas al mes (aprox.)</span></div>
    <div class="card stat"><b>${eur.format(yearly)}</b><span>al año</span></div>
    <div class="card stat"><b>${eur.format(once)}</b><span>pagos de una vez</span></div>
    <div class="card stat"><b>${pend.length}</b><span>precios por confirmar</span></div>
  </div>
  ${pend.length?`<div class="status warn" style="margin-top:12px">⚠️ Faltan los precios de: ${pend.map(i=>esc(i.name)).join(", ")}. Toca <b>Editar</b> y pon lo que pagas.</div>`:""}
  ${expFormHtml()}
  ${next.length?`<h2>Próximos cobros (60 días)</h2><div class="card list">${next.map(i=>`<div class="item"><div><b>${esc(i.name)}</b><div class="muted small">${fd(i.next)}</div></div><b>${i.amount==null?"?":expMoney(i.amount,i.currency)}</b></div>`).join("")}</div>`:""}
  ${groups}
  <h2>Según el uso (lo calcula el servidor)</h2>
  <div class="card"><table class="money">
    <tr><td>SMS de los códigos este mes</td><td>${eur.format(sms.smsCostMonth||0)}</td></tr>
    <tr><td>Servidor (Render), según KLK_SERVER_COST</td><td>${eur.format(sms.serverCost||0)}</td></tr>
  </table></div>
  <div class="card" style="margin-top:12px"><label class="small muted" for="expRate">Cambio para pasar dólares a euros: 1 US$ =</label>
    <div style="display:flex;gap:8px;margin-top:6px"><input id="expRate" type="number" step="0.01" min="0.1" max="5" value="${rate}" style="max-width:120px"> <span class="muted" style="align-self:center">€</span> <button class="btn" id="expRateSave">Guardar</button></div>
    <p class="muted small" style="margin:8px 0 0">Los totales son aproximados. La factura exacta la ves en cada servicio.${d.updatedAt?` Última edición: ${dt(d.updatedAt)}.`:""}</p></div>`;
}
function expFormHtml(){
  const d=data.expenses, it=expEdit===null?null:(expEdit===""?{active:true,every:"month",currency:"EUR",amount:null}:(d.items.find(i=>i.id===expEdit)||{}));
  if(!it)return `<div style="margin-top:14px"><button class="btn primary" id="expAdd">＋ Añadir gasto</button></div>`;
  const v=k=>esc(it[k]==null?"":String(it[k]));
  return `<h2>${it.id?"Editar":"Nuevo"} gasto</h2><div class="card form">
    <label for="ef-name">Nombre</label><input id="ef-name" value="${v("name")}" maxlength="80" placeholder="Ej.: Render">
    <label for="ef-what">Para qué es</label><input id="ef-what" value="${v("what")}" maxlength="120" placeholder="Ej.: Servidor de KLK">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div><label for="ef-amount">Importe</label><input id="ef-amount" type="number" step="0.01" min="0" value="${v("amount")}" placeholder="?"></div>
      <div><label for="ef-cur">Moneda</label><select id="ef-cur"><option value="EUR"${it.currency!=="USD"?" selected":""}>€ euros</option><option value="USD"${it.currency==="USD"?" selected":""}>US$ dólares</option></select></div>
      <div><label for="ef-every">Cada</label><select id="ef-every">${Object.entries(EVERY).map(([k,t])=>`<option value="${k}"${(it.every||"month")===k?" selected":""}>${t}</option>`).join("")}</select></div>
    </div>
    <label for="ef-next">Próximo cobro (o fecha del pago)</label><input id="ef-next" type="date" value="${v("next")}">
    <label for="ef-notes">Notas</label><input id="ef-notes" value="${v("notes")}" maxlength="300" placeholder="Ej.: con la tarjeta acabada en…">
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="ef-active" type="checkbox"${it.active!==false?" checked":""}> Lo sigo pagando</label>
    <label style="display:flex;gap:8px;align-items:center"><input id="ef-paid" type="checkbox"${it.paid?" checked":""}> Ya está pagado (pagos de una vez)</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="expSave">Guardar</button><button class="btn" id="expCancel">Cancelar</button>${it.id?`<button class="btn" id="expDel" style="color:var(--red)">Borrar</button>`:""}</div>
  </div>`;
}
async function expPersist(doc,ok){
  try{data.expenses=await api("expenses",{method:"PUT",body:JSON.stringify(doc)});expEdit=null;expEditing=false;const pend=data.expenses.items.filter(i=>i.active&&i.amount==null).length;$("#expBadge").hidden=!pend;$("#expBadge").textContent=pend;toast(ok);render()}catch(e){if(e.message!=="401")toast(e.message)}
}
function expHandle(t){
  const d=data.expenses;if(!d)return false;
  if(t.id==="expAdd"){expEdit="";expEditing=true;render();return true}
  if(t.dataset.expEdit){expEdit=t.dataset.expEdit;expEditing=true;render();setTimeout(()=>{const n=$("#ef-name");n&&n.scrollIntoView({block:"center"})},0);return true}
  if(t.id==="expCancel"){expEdit=null;expEditing=false;render();return true}
  if(t.id==="expDel"){if(!confirm("¿Borrar este gasto de la lista?"))return true;expPersist({...d,items:d.items.filter(i=>i.id!==expEdit)},"Gasto borrado");return true}
  if(t.id==="expRateSave"){const r=parseFloat($("#expRate").value);if(!(r>0)){toast("Pon un número");return true}expPersist({...d,usdToEur:r},"Cambio guardado");return true}
  if(t.id==="expSave"){
    const name=$("#ef-name").value.trim();if(!name){toast("Pon un nombre");return true}
    const a=$("#ef-amount").value.trim();
    const item={id:expEdit||("g"+Date.now().toString(36)),name,what:$("#ef-what").value.trim(),amount:a===""?null:Math.max(0,parseFloat(a)),currency:$("#ef-cur").value,every:$("#ef-every").value,next:$("#ef-next").value,notes:$("#ef-notes").value.trim(),active:$("#ef-active").checked,paid:$("#ef-paid").checked};
    const items=d.items.slice();const idx=expEdit?items.findIndex(i=>i.id===expEdit):-1;
    if(idx>=0)items[idx]=item;else items.push(item);
    expPersist({...d,items},"Gasto guardado");return true}
  return false;
}
function renderServices(){
  const sv=data.services;
  const checks=sv?sv.checks.map(c=>`<div class="svc"><i class="dot ${c.ok?"":"bad"}"></i><div><b>${esc(c.name)}</b><div class="muted small">${esc(c.detail)}</div></div></div>`).join(""):`<div class="empty">No se pudo leer el estado del servidor. Pulsa Actualizar.</div>`;
  const bad=sv?sv.checks.filter(c=>!c.ok).length:0;
  const links=LINKS.map(([t,ls])=>`<h2>${esc(t)}</h2><div class="links">${ls.map(([n,d,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener"><b>${esc(n)} ↗</b><span>${esc(d)}</span></a>`).join("")}</div>`).join("");
  return `${sv?(bad?`<div class="status bad">⚠️ ${bad} servicio${bad>1?"s":""} con problemas. Revisa las claves en Render → Environment.</div>`:`<div class="status ok">✅ Todo funciona</div>`):""}
  <div class="card">${checks}
  ${sv?`<p class="muted small" style="margin:12px 0 0">Servidor encendido ${ago(sv.startedAt)}${sv.commit?`, versión ${esc(sv.commit)}`:""}</p>`:""}</div>
  ${links}`;
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(!data.stats){$("#main").innerHTML=`<div class="empty">Cargando…</div>`;return}
  $("#main").innerHTML=({home:renderHome,reports:renderReports,gente:renderGente,news:renderNews,banned:renderBanned,money:renderMoney,gastos:renderGastos,services:renderServices})[tab]();
}

async function act(fn,ok){try{await fn();toast(ok);await loadAll()}catch(e){if(e.message!=="401")toast(e.message)}}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(expHandle(t))return;
  if(t.id==="toggleAll"){showAll=!showAll;loadAll();return}
  if(t.dataset.ban){
    if(!confirm("¿Bloquear esta cuenta? No podrá usar KLK."))return;
    act(()=>api(`accounts/${t.dataset.ban}/ban`,{method:"POST",body:JSON.stringify({reason:t.dataset.reason||""})}),"Cuenta bloqueada");return}
  if(t.dataset.unban){
    if(!confirm("¿Desbloquear esta cuenta?"))return;
    act(()=>api(`accounts/${t.dataset.unban}/unban`,{method:"POST"}),"Cuenta desbloqueada");return}
  if(t.dataset.delpost){
    if(!confirm("¿Borrar esta publicación de Mi Gente? No se puede deshacer."))return;
    act(()=>api(`gente/posts/${t.dataset.delpost}`,{method:"DELETE"}),"Publicación borrada");return}
  if(t.dataset.delcomment){
    if(!confirm("¿Borrar este comentario?"))return;
    act(()=>api(`gente/comments/${t.dataset.delcomment}`,{method:"DELETE"}),"Comentario borrado");return}
  if(t.dataset.resolve){act(()=>api(`reports/${t.dataset.resolve}/resolve`,{method:"POST"}),"Marcada como revisada");return}
  if(t.dataset.delnews){
    if(!confirm("¿Borrar este aviso?"))return;
    act(()=>api(`announcements/${t.dataset.delnews}`,{method:"DELETE"}),"Aviso borrado");return}
  if(t.id==="send"){
    const title=$("#nt").value.trim(),body=$("#nb").value.trim();
    if(!title||!body){toast("Pon un título y un mensaje");return}
    if(!confirm("¿Enviar este aviso a TODOS los usuarios?"))return;
    act(()=>api("announcements",{method:"POST",body:JSON.stringify({title,body})}),"Aviso enviado a todos 📣");return}
  if(t.id==="banPhone"){
    const phone=$("#bp").value.replace(/\s/g,""),reason=$("#br").value.trim();
    if(!phone){toast("Escribe el número");return}
    if(!confirm(`¿Bloquear ${phone}?`))return;
    act(()=>api("ban-phone",{method:"POST",body:JSON.stringify({phone,reason})}),"Número bloqueado");return}
});
$("#enter").onclick=login;
$("#tok").onkeydown=e=>{if(e.key==="Enter")login()};
$("#logout").onclick=()=>logout("");
$("#refresh").onclick=()=>{const b=$("#refresh");b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");loadAll().then(()=>toast("Actualizado"))};
$("#sideLogo").src=$("header .logo").src;
setInterval(()=>{if(token&&!$("#app").hidden&&document.visibilityState==="visible")loadAll()},60000);

if(token){api("stats").then(s=>{data.stats=s;$("#login").hidden=true;$("#app").hidden=false;render();loadAll()}).catch(()=>{})}
