name: Voz del anuncio v5 (Mi Gente, Negocios, San)
on:
  push:
    branches: [mi-gente]
    paths:
      - "marketing/anuncio/guion_v5.txt"
      - ".github/workflows/voz8.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts soundfile openai-whisper
          git clone -q --depth 1 -b marketing-voz "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ref
      - name: Generar
        run: GUION=marketing/anuncio/guion_v5.txt python marketing/anuncio/voz_neutra.py
      - name: Guardar en la rama marketing-voz8
        if: always()
        run: |
          cd out
          git init -q -b marketing-voz8
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Voz anuncio v5"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" marketing-voz8
