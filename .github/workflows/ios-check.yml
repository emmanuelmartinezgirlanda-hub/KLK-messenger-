# Comprueba que la app de iPhone compila (sin firmar) en ramas de prueba.
name: iPhone compila (comprobación)
on:
  push:
    branches: [belleza, grupo]
  workflow_dispatch:
concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar carpetas nativas
        run: bash tool/prepare_native.sh
      - name: Analizar Dart
        run: flutter analyze lib/features/calls packages/klk_native/lib --no-fatal-infos --no-fatal-warnings
      - name: Compilar iPhone (sin firma)
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign \
            --dart-define=KLK_TEST=true --dart-define=KLK_PLUS=true \
            --dart-define=KLK_BUSINESS=true --dart-define=KLK_GENTE=true 2>&1 | tee build.log | tail -40
      - name: Errores
        if: failure()
        shell: bash
        run: grep -h -E "error:|Error \(Xcode\)|fatal" build.log 2>/dev/null | sort -u | head -80 || true
