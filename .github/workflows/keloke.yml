name: Arreglar «Queloqué mésenyer» en el anuncio
on:
  push:
    branches: [mi-gente]
    paths:
      - "marketing/anuncio/keloke/**"
      - ".github/workflows/keloke.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q soundfile openai-whisper
          git clone -q --depth 1 -b marketing-keloke "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out && rm -rf out/.git
      - name: Generar
        run: python marketing/anuncio/keloke/palabras.py
      - name: Guardar en la rama marketing-keloke
        if: always()
        run: |
          cd out
          git init -q -b marketing-keloke
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Queloque arreglado"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" marketing-keloke
