# Comprobación del servidor (Go): análisis y tests en cada cambio de server/.
name: Comprobar servidor

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/servidor.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # Igual que el Dockerfile de Render: completa go.sum antes de compilar.
      - name: Dependencias
        run: go mod tidy
      - name: Análisis
        run: go vet ./...
      - name: Tests
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee test.log
      - name: Resumen del error (si falla)
        if: failure()
        run: |
          grep -E -- "--- FAIL|_test.go:[0-9]+|panic:|FAIL\s" test.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
