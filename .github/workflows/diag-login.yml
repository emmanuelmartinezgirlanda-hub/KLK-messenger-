name: Diagnóstico login revisión
on:
  push:
    branches: [diag-login]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir código como el revisor
        run: |
          sleep 240; for p in "+112025550147" "+1 202 555 0147" "+12025550147"; do
            echo "== $p"
            out=$(curl -sS -m 90 -X POST https://klk-server.onrender.com/v1/verification/request \
              -H 'Content-Type: application/json' -d "{\"phone\":\"$p\"}" -w " HTTP %{http_code} en %{time_total}s" 2>&1 | tr '\n' ' ')
            echo "::notice title=$p::$out"
          done
          h=$(curl -sS -m 60 https://klk-server.onrender.com/healthz -w " HTTP %{http_code}" 2>&1 | tr '\n' ' '); echo "::notice title=healthz::$h"
