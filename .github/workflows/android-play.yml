# Google Play: compila el .aab de la tienda (sin Plus ni opciones de prueba).
# Sale firmado con la clave de pruebas; se vuelve a firmar con la clave de
# subida (klk_upload) fuera de GitHub antes de subirlo a Play Console.
name: KLK messenger para Google Play (.aab)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Número de versión para Google Play (tiene que subir cada vez)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar carpetas nativas
        shell: bash
        run: bash tool/prepare_native.sh
      - name: Compilar .aab
        shell: bash
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-number=${{ inputs.version_code }} \
            --dart-define=KLK_BUSINESS=true \
            --dart-define=KLK_GENTE=true 2>&1 | tee build.log
          cp build/app/outputs/bundle/release/app-release.aab KLK-messenger-play-sin-firmar.aab
      - name: Resumen del error (si falla)
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -n -i -E "error|exception|failed|What went wrong" build.log | head -60 > errs.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errs.txt)
          echo "::error title=Errores::${msg}"
      - name: Publicar (sin firmar con la clave de subida)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-${{ inputs.version_code }}
          name: Google Play ${{ inputs.version_code }} (sin firmar)
          prerelease: true
          make_latest: false
          files: KLK-messenger-play-sin-firmar.aab
