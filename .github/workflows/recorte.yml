name: Recorte de la voz del anuncio
on:
  push:
    branches: [main]
    paths:
      - "marketing/anuncio/recorte.py"
      - ".github/workflows/recorte.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recorte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get install -y -qq ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q openai-whisper
          git clone -q --depth 1 -b marketing-voz2 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" voz
          python marketing/anuncio/recorte.py
          cd voz && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add recorte.json && git commit -qm "Recorte" && git push -q origin marketing-voz2
