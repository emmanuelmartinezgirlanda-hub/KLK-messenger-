name: ingles_diario
description: Inglés Diario — vocabulario y pronunciación, cinco minutos al día.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/index.html

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/icon.png
  remove_alpha_ios: true
