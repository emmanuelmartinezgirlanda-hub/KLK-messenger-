.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px}

.bdg.on svg{color:var(--brand)}

.bdg span{font-size:.8rem;color:var(--muted)}

.time{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}

.note{font-size:.85rem;color:var(--muted);margin:0}

@media (max-width:380px){.hero{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Estado y progreso ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DAY=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)};
const INT=[0,1,2,4,8,16];
const fresh=()=>({srs:{},xp:0,days:[],today:{d:0,n:0},stats:{q:0,ok:0},best:0,badges:[],dlg:[],goal:10,goalHit:0});
let S=LS.get("sz_state",null);
if(!S||!S.srs){
  S=fresh();const t=DAY();
  LS.get("ie_known",[]).forEach(i=>{if(W[i])S.srs["w:"+i]={b:2,d:t+2}});
  LS.get("ie_pknown",[]).forEach(i=>{if(P[i])S.srs["p:"+i]={b:2,d:t+2}});
  const st=LS.get("ie_stats",null);if(st)S.stats={q:st.quiz||0,ok:st.ok||0};
  S.xp=S.stats.ok*10;
}
const save=()=>LS.set("sz_state",S);
const ITEMS={w:W,p:P,e:E,r:R};
const known=k=>!!(S.srs[k]&&S.srs[k].b>=2);
const countKnown=(t,arr)=>arr.filter(x=>known(t+":"+x.id)).length;
function due(){const t=DAY();return Object.keys(S.srs).filter(k=>{const s=S.srs[k],[ty,id]=k.split(":");return s.b>=1&&s.d<=t&&ITEMS[ty]&&ITEMS[ty][+id]})}
function streak(){const set=new Set(S.days),t=DAY();let d=set.has(t)?t:t-1,n=0;while(set.has(d)){n++;d--}return n}
const LV=[[0,"Principiante"],[150,"Aprendiz"],[400,"Conversador"],[900,"Fluido"],[1800,"Casi nativo"],[3500,"Gringo honorario"]];
function lvl(xp=S.xp){let i=0;LV.forEach((l,j)=>{if(xp>=l[0])i=j});const next=LV[i+1]?LV[i+1][0]:null;return {i,name:LV[i][1],next,pct:next?Math.round((xp-LV[i][0])/(next-LV[i][0])*100):100}}
function todayN(){return S.today.d===DAY()?S.today.n:0}

const BADGES=[
 ["primer","Primer paso","Tu primer acierto",()=>S.stats.ok>=1],
 ["racha3","Tres seguidos","3 días de racha",()=>streak()>=3],
 ["racha7","Semana completa","7 días de racha",()=>streak()>=7],
 ["racha30","Imparable","30 días de racha",()=>streak()>=30],
 ["meta","Meta cumplida","Completa la meta del día",()=>S.goalHit>=1],
 ["cien","Cien aciertos","100 respuestas correctas",()=>S.stats.ok>=100],
 ["frases","Lengua suelta","Domina 25 frases",()=>countKnown("p",P)>=25],
 ["errores","Cero errores","Domina los errores típicos",()=>countKnown("e",E)===E.length],
 ["oido","Buen oído","Domina la pronunciación",()=>countKnown("r",R)===R.length],
 ["dialogos","Conversador","Completa todos los diálogos",()=>DLG.every(d=>S.dlg.includes(d.id))],
 ["reto","Rayo","20 puntos en el reto",()=>S.best>=20],
 ["fluido","Fluido","Llega al nivel Fluido",()=>S.xp>=900]
];

let toastT=null;const toastQ=[];
function toast(msg){toastQ.push(msg);if(!toastT)nextToast()}
function nextToast(){const el=$("#toast");if(!toastQ.length){el.hidden=true;toastT=null;return}el.textContent=toastQ.shift();el.hidden=false;toastT=setTimeout(nextToast,2600)}

function addXP(n){const before=lvl().i;S.xp+=n;const L=lvl();if(L.i>before)toast("¡Subiste de nivel! Ahora eres "+L.name+".")}
function bumpToday(){const t=DAY();if(S.today.d!==t)S.today={d:t,n:0};S.today.n++;if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-400)}if(S.today.n===S.goal){S.goalHit++;toast("¡Meta del día cumplida!")}}
function checkBadges(){BADGES.forEach(([id,name,,ok])=>{if(!S.badges.includes(id)&&ok()){S.badges.push(id);toast("Insignia nueva: "+name)}})}
function after(){save();checkBadges();save();paintHeader()}
function tally(ok,xp=10){S.stats.q++;if(ok){S.stats.ok++;addXP(xp);bumpToday()}after()}
function grade(k,ok){const t=DAY(),s=S.srs[k]||{b:0,d:t};if(ok){s.b=Math.min(s.b+1,5);s.d=t+INT[s.b]}else{s.b=1;s.d=t}S.srs[k]=s;tally(ok)}
function markKnown(k){const t=DAY(),s=S.srs[k]||{b:0,d:t};s.b=Math.min(Math.max(s.b+1,2),5);s.d=t+INT[s.b];S.srs[k]=s;addXP(5);bumpToday();after()}
function relearn(k){S.srs[k]={b:1,d:DAY()};save()}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

let ttsOK="speechSynthesis" in window;
function say(t,rate=.9){
  if(!ttsOK){$("#ttsnote").hidden=false;return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;
    const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
    u.onerror=()=>{$("#ttsnote").hidden=false};speechSynthesis.speak(u)}catch(e){ttsOK=false;$("#ttsnote").hidden=false}
}
if(ttsOK)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srBroken=false;
function scoreSpeech(t,h){const tw=norm(t).split(" ").filter(Boolean),pool=norm(h).split(" ");let m=0;tw.forEach(w=>{const i=pool.indexOf(w);if(i>-1){m++;pool.splice(i,1)}});return tw.length?Math.round(m/tw.length*100):0}
function listen(target,cb){
  let done=false;const fin=r=>{if(!done){done=true;cb(r)}};
  try{const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;
    r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);let best=-1,heard=alts[0]||"";alts.forEach(a=>{const s=scoreSpeech(target,a);if(s>best){best=s;heard=a}});fin({heard,score:Math.max(best,0)})};
    r.onerror=e=>fin({err:e.error||"error"});r.onend=()=>fin({heard:"",score:0});r.start();
  }catch(e){fin({err:"start"})}
}

/* ---------- Preguntas ---------- */
function gapped(p){const re=new RegExp("\\b"+p.gap+"\\b");return esc(p.en).replace(re,'<span class="gap">&nbsp;</span>')}
function qFor(k){const [t,id0]=k.split(":"),id=+id0;let q;
  if(t==="w"){const c=W[id];let others=shuffle(W.filter(w=>w.id!==id&&w.cat===c.cat)).slice(0,3);
    const opts=shuffle([c,...others]);const es2en=Math.random()<.5;
    q={label:es2en?"¿Cómo se dice en inglés?":"¿Qué significa?",prompt:`<p class="q">${esc(es2en?c.es:c.en)}</p>`,opts:opts.map(o=>es2en?o.en:o.es),correct:opts.indexOf(c),fb:ok=>ok?`¡Correcto! “${c.ex}”`:`Era “${c.en}” = ${c.es}.`,say:c.en}}
  else if(t==="p"){const p=P[id],g=p.gap.toLowerCase();const others=shuffle([...new Set(P.map(x=>x.gap.toLowerCase()))].filter(x=>x!==g)).slice(0,3);const opts=shuffle([g,...others]);
    q={label:"Completa la frase",right:esc(p.es),prompt:`<p class="phrase">${gapped(p)}</p>`,opts,correct:opts.indexOf(g),fb:ok=>(ok?"¡Correcto! ":`Era «${p.gap}». `)+`“${p.en}”: ${p.use}`,say:p.en}}
  else if(t==="e"){const e=E[id];const opts=shuffle([e.bad,e.good]);
    q={label:"¿Cuál es la correcta?",prompt:"",opts,correct:opts.indexOf(e.good),fb:ok=>(ok?"¡Bien! ":`La correcta es «${e.good}». `)+e.why,say:e.good}}
  else {const r=R[id];
    if(r.type==="par"){const w=Math.random()<.5?"a":"b";
      q={label:"¿Qué palabra oíste?",right:esc(r.es),prompt:`<button class="btn primary play" id="play">▶ Reproducir otra vez</button>`,opts:[r.a,r.b],correct:w==="a"?0:1,fb:ok=>(ok?"¡Bien! ":`Era «${r[w]}». `)+r.tip,say:r[w],play:r[w]}}
    else{const others=shuffle(R.filter(x=>x.type==="red"&&x.id!==id)).slice(0,3);const opts=shuffle([r,...others]);
      q={label:"¿Qué significa?",prompt:`<p class="q">${esc(r.a)}</p>`,opts:opts.map(o=>o.b),correct:opts.indexOf(r),fb:ok=>(ok?"¡Bien! ":`«${r.a}» = «${r.b}». `)+`“${r.ex}”`,say:r.ex}}}
  q.k=k;return q}

function mc(o){
  stage.innerHTML=(o.head||"")+`<div class="card"><div class="meta"><span class="label">${o.label}</span><span>${o.right||""}</span></div>${o.prompt}
    <div class="opts">${o.opts.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("")}</div><p class="fb" id="fb" aria-live="polite"></p></div>
    <div class="row"><button class="btn primary" id="next">${o.nextLabel||"Siguiente"}</button></div>`;
  let done=false;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=+b.dataset.i===o.correct;
    stage.querySelectorAll(".opt").forEach((x,j)=>{if(j===o.correct)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
    const fb=$("#fb");fb.className="fb "+(ok?"good":"no");fb.textContent=o.fb(ok);o.onAnswer(ok)});
  on("next",o.next);
  if(o.play){on("play",()=>say(o.play));if(!o.played){o.played=1;setTimeout(()=>say(o.play),300)}}
}

/* ---------- Aprender ---------- */
function mkDeck(items,pre){const u=items.filter(x=>!known(pre+x.id));return {list:shuffle(u.length?u:items),i:0,rev:false}}
function cardButtons(D,x,k){
  on("again",()=>{relearn(k);D.list.push(x);D.i++;D.rev=false;render()});
  on("got",()=>{markKnown(k);D.i++;D.rev=false;render()});
  on("flip",()=>{D.rev=true;render()});
}
const cardRow=D=>`<div class="row">${D.rev?`<button class="btn bad" id="again">Repasar</button><button class="btn ok" id="got">¡La sé!</button>`:`<button class="btn primary" id="flip">Ver respuesta</button>`}</div>`;
function rCards(kind){
  const isW=kind==="w";let D=isW?vdeck:pdeck;
  if(!D||D.i>=D.list.length){D=mkDeck(isW?wpool():ppool(),kind+":");if(isW)vdeck=D;else pdeck=D}
  const x=D.list[D.i],k=kind+":"+x.id;
  const front=isW?`<h2 class="word">${esc(x.en)}</h2><div class="ipa">${esc(x.ipa)} · <span class="pos">${esc(x.pos)}</span></div>`:`<h2 class="phrase">${esc(x.en)}</h2>`;
  const back=`<div><span class="label">Significa</span><div class="mean">${esc(x.es)}</div></div>`+(isW?`<p class="ex">${esc(x.ex)}<i>${esc(x.exEs)}</i></p>`:`<p class="use"><b>Cuándo se usa</b>${esc(x.use)}</p>`);
  stage.innerHTML=subsHtml()+(isW?catHtml(WCATS,wcat,"wcat"):catHtml(PCATS,pcat,"pcat"))+
   `<div class="card tall"><div class="meta"><span>${esc(x.cat)}${known(k)?' · <span class="okc">la sabes</span>':""}</span><span>${D.i+1} / ${D.list.length}</span></div>
    ${front}<button class="speak" data-say="${esc(x.en)}">▶ Escuchar</button>
    ${D.rev?back:`<p class="hint">${isW?"¿Sabes qué significa? Piénsalo y gira la tarjeta.":"Escúchala, repítela en voz alta y adivina qué significa."}</p>`}</div>`+cardRow(D);
  cardButtons(D,x,k);
}
function rErr(){
  if(!edeck||edeck.i>=edeck.list.length)edeck=mkDeck(E,"e:");
  const D=edeck,x=D.list[D.i],k="e:"+x.id;
  stage.innerHTML=subsHtml()+`<div class="card tall"><div class="meta"><span class="label">Errores típicos${known(k)?' · <span class="okc">lo tienes</span>':""}</span><span>${D.i+1} / ${D.list.length}</span></div>
    <span class="label">Esta frase está mal</span><p class="badline">${esc(x.bad)}</p>
    ${D.rev?`<span class="label">Así se dice</span><p class="goodline">${esc(x.good)}</p><button class="speak" data-say="${esc(x.good)}">▶ Escuchar</button><p class="use"><b>Por qué</b>${esc(x.why)}</p>`:`<p class="hint">¿Sabes cómo se dice bien? Piénsalo antes de ver la respuesta.</p>`}</div>`+cardRow(D);

}
function rPron(){
  const items=R.filter(r=>r.type===prmode);
  if(!rdeck||rdeck.i>=rdeck.list.length)rdeck=mkDeck(items,"r:");
  const D=rdeck,x=D.list[D.i],k="r:"+x.id;D.rev=true;
  const seg=`<div class="seg" role="group" aria-label="Tipo"><button data-pm="par" aria-pressed="${prmode==="par"}">Sonidos parecidos</button><button data-pm="red" aria-pressed="${prmode==="red"}">Inglés hablado</button></div>`;
  const body=x.type==="par"?
   `<div class="hero"><div class="tile"><b style="font-size:2rem">${esc(x.a)}</b><span class="small">${esc(x.ia)}</span><button class="speak" data-say="${esc(x.a)}">▶ Escuchar</button></div><div class="tile"><b style="font-size:2rem">${esc(x.b)}</b><span class="small">${esc(x.ib)}</span><button class="speak" data-say="${esc(x.b)}">▶ Escuchar</button></div></div>
    <p class="es">${esc(x.es)}</p><p class="use"><b>El truco</b>${esc(x.tip)}</p>`:
   `<h2 class="word">${esc(x.a)}</h2><div class="ipa">= ${esc(x.b)}</div><p class="ex">${esc(x.ex)}<i>${esc(x.exEs)}</i></p><button class="speak" data-say="${esc(x.ex)}">▶ Escuchar el ejemplo</button><p class="use"><b>Ojo</b>${esc(x.tip)}</p>`;
  stage.innerHTML=subsHtml()+seg+`<div class="card tall"><div class="meta"><span class="label">${x.type==="par"?"Escucha la diferencia":"Así se habla de verdad"}${known(k)?' · <span class="okc">lo tienes</span>':""}</span><span>${D.i+1} / ${D.list.length}</span></div>${body}</div>`+cardRow(D);
  stage.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{prmode=b.dataset.pm;rdeck=null;render()});
  cardButtons(D,x,k);
}

/* ---------- Practicar ---------- */
function acc(){return S.stats.q?`${Math.round(S.stats.ok/S.stats.q*100)}% aciertos`:""}
function rQuiz(){
  if(!quizQ)quizQ=qFor("w:"+pick(wpool()).id);const q=quizQ;
  mc({...q,head:subsHtml()+catHtml(WCATS,wcat,"wcat"),right:acc(),onAnswer:ok=>{grade(q.k,ok);say(q.say)},next:()=>{quizQ=null;render()}});
}
function rComp(){
  if(!compQ)compQ=qFor("p:"+pick(ppool()).id);const q=compQ;
  mc({...q,head:subsHtml()+catHtml(PCATS,pcat,"pcat"),onAnswer:ok=>{grade(q.k,ok);say(q.say)},next:()=>{compQ=null;render()}});
}
function rOido(){
  if(!oidoQ)oidoQ=qFor("r:"+pick(R.filter(r=>r.type==="par")).id);const q=oidoQ;
  mc({...q,head:subsHtml(),onAnswer:ok=>grade(q.k,ok),next:()=>{oidoQ=null;render()}});
}
function rRep(){
  if(!repQ){repQ={x:repTarget||pick(ppool())};repTarget=null}
  const x=repQ.x,canMic=!!SR&&!srBroken;
  const note=!SR?`<p class="note">Este navegador no deja usar el micrófono aquí, así que te valoras tú.</p>`:srBroken?`<p class="note">No pude usar el micrófono (puede que esté bloqueado). Te valoras tú y puedes activarlo en los permisos del navegador.</p>`:"";
  stage.innerHTML=subsHtml()+catHtml(PCATS,pcat,"pcat")+`<div class="card tall"><div class="meta"><span class="label">Repite conmigo</span><span>${esc(x.cat)}</span></div>
    <h2 class="phrase">${esc(x.en)}</h2><p class="es">${esc(x.es)}</p>
    <div class="row tight"><button class="speak" id="s1">▶ Escuchar</button><button class="speak" id="s2">▶ Más lento</button></div>
    ${canMic?`<button class="mic" id="mic">${MIC}<span id="micl">Pulsa y di la frase</span></button><div id="res" aria-live="polite"></div>`
      :`<p class="hint">Repítela en voz alta tres veces imitando el ritmo. ¿Te salió natural?</p><div class="row"><button class="btn bad" id="sagain">Otra vez</button><button class="btn ok" id="sgood">¡Me salió bien!</button></div><p class="fb" id="sfb" aria-live="polite"></p>`}
    </div><div class="row"><button class="btn primary" id="next">Siguiente frase</button></div>${note}`;
  on("s1",()=>say(x.en));on("s2",()=>say(x.en,.6));on("next",()=>{repQ=null;render()});
  on("sagain",()=>say(x.en,.75));
  on("sgood",()=>{if(repQ.done)return;repQ.done=1;grade("p:"+x.id,true);$("#sfb").className="fb good";$("#sfb").textContent="¡Genial! Sumaste puntos y la frase entra en tu repaso."});
  on("mic",()=>{const btn=$("#mic");if(btn.disabled)return;btn.disabled=true;btn.classList.add("live");$("#micl").textContent="Escuchando…";
    listen(x.en,r=>{btn.disabled=false;btn.classList.remove("live");$("#micl").textContent="Pulsa y dila otra vez";
      if(r.err){if(["not-allowed","service-not-allowed","audio-capture","start","network"].includes(r.err)){srBroken=true;render();return}
        $("#res").innerHTML=`<p class="fb no">No te oí bien. Prueba otra vez, un poco más cerca del micrófono.</p>`;return}
      const s=r.score,cls=s>=80?"good":s>=50?"mid":"no";
      $("#res").innerHTML=`<div class="meter" aria-hidden="true"><i class="${cls}" style="width:${Math.max(s,4)}%"></i></div>
        <p class="fb ${s>=80?"good":"no"}">${s>=80?"¡Se te entendió perfecto!":s>=50?"Casi. Escúchala otra vez y fíjate en el ritmo.":"No se entendió bien. Prueba más despacio."} (${s}%)</p>
        <p class="heard">Te entendí: «${esc(r.heard||"…")}»</p>`;
      if(s>=80&&!repQ.done){repQ.done=1;grade("p:"+x.id,true)}});});
}
function rDict(){
  const isW=dmode==="w";
  if(!dictQ){const x=pick(isW?wpool():ppool());dictQ={x,k:(isW?"w:":"p:")+x.id}}
  const x=dictQ.x;
  stage.innerHTML=subsHtml()+`<div class="seg" role="group" aria-label="Qué dictar"><button data-dm="w" aria-pressed="${isW}">Palabras</button><button data-dm="p" aria-pressed="${!isW}">Frases completas</button></div>
   <div class="card"><div class="meta"><span class="label">Escucha y escribe</span><span>Pista: ${esc(x.es)}</span></div>
    <div class="row tight"><button class="btn primary" id="play">▶ Reproducir</button><button class="btn" id="slow">▶ Lento</button></div>
    <label class="label" for="dictIn">Lo que oyes, en inglés</label>
    <input type="text" id="dictIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${isW?"Escribe la palabra…":"Escribe la frase completa…"}">
    <p class="fb" id="dfb" aria-live="polite"></p></div>
   <div class="row"><button class="btn" id="dskip">Otra</button><button class="btn primary" id="dcheck">Comprobar</button></div>`;
  stage.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{dmode=b.dataset.dm;dictQ=null;render()});
  on("play",()=>say(x.en));on("slow",()=>say(x.en,.6));on("dskip",()=>{dictQ=null;render()});
  const check=()=>{const v=$("#dictIn").value,fb=$("#dfb");
    if(!v.trim()){fb.className="fb no";fb.textContent="Escribe lo que oyes antes de comprobar.";return}
    if(norm(v)===norm(x.en)){fb.className="fb good";fb.textContent=`¡Perfecto! “${x.en}”`;if(!dictQ.done){dictQ.done=1;grade(dictQ.k,true)}}
    else{const tw=norm(x.en).split(" "),vw=norm(v).split(" ");const miss=tw.filter((w,i)=>vw[i]!==w).length;
      fb.className="fb no";fb.textContent=`${isW?"Casi.":`Fallaste ${miss} ${miss===1?"palabra":"palabras"}.`} Se escribe: “${x.en}”`;if(!dictQ.done){dictQ.done=1;tally(false)}}};
  on("dcheck",check);$("#dictIn").onkeydown=e=>{if(e.key==="Enter")check()};
}
function advanceDlg(){const st=dlg.d.steps;let last=null;
  while(dlg.i<st.length&&st[dlg.i].t==="them"){dlg.log.push({who:"them",en:st[dlg.i].en,es:st[dlg.i].es});last=st[dlg.i].en;dlg.i++}
  if(dlg.i<st.length)dlg.cur=shuffle(st[dlg.i].opts.map((o,j)=>({en:o[0],ok:!!o[1],fb:o[2],j})));
  else if(!dlg.finished){dlg.finished=true;if(!S.dlg.includes(dlg.d.id)){S.dlg.push(dlg.d.id);addXP(30);toast("+30 XP por completar el diálogo")}after()}
  dlg.speak=last}
function rDlg(){
  if(!dlg){
    stage.innerHTML=subsHtml()+`<p class="note">Conversaciones reales: lee lo que te dicen, escúchalo y elige la respuesta más natural.</p><div class="list">${DLG.map(d=>{const done=S.dlg.includes(d.id);
      return `<button class="dl" data-dlg="${d.id}"><span><b>${esc(d.title)}</b><span class="es">${esc(d.scene)}</span></span><span class="tag ${done?"done":""}">${done?"Hecho":"Empezar"}</span></button>`}).join("")}</div>`;
    stage.querySelectorAll("[data-dlg]").forEach(b=>b.onclick=()=>{dlg={d:DLG[+b.dataset.dlg],i:0,log:[],miss:0};advanceDlg();render()});return}
  const st=dlg.d.steps,ended=dlg.i>=st.length;
  stage.innerHTML=subsHtml()+`<div class="card"><div class="meta"><span class="label">${esc(dlg.d.title)}</span><span>${esc(dlg.d.scene)}</span></div>
   <div class="chat">${dlg.log.map(m=>m.who==="them"?`<div class="bub them"><span>${esc(m.en)}</span><small>${esc(m.es)}</small><button class="speak" data-say="${esc(m.en)}">▶</button></div>`:`<div class="bub you">${esc(m.en)}</div>`).join("")}</div>
   ${ended?`<p class="fb good">¡Diálogo completado${dlg.miss?` con ${dlg.miss} ${dlg.miss===1?"fallo":"fallos"}`:" sin fallos"}!</p>`
     :`<span class="label">Tu respuesta</span><div class="opts">${dlg.cur.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o.en)}</button>`).join("")}</div><p class="fb" id="dfb" aria-live="polite"></p>`}
  </div><div class="row">${ended?`<button class="btn" id="dagain">Repetir</button>`:""}<button class="btn ${ended?"primary":""}" id="dback">${ended?"Otro diálogo":"Salir"}</button></div>`;
  on("dback",()=>{dlg=null;render()});on("dagain",()=>{dlg={d:dlg.d,i:0,log:[],miss:0};advanceDlg();render()});
  stage.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const o=dlg.cur[+b.dataset.o];
    if(dlg.busy)return;
    if(o.ok){dlg.busy=true;dlg.log.push({who:"you",en:o.en});dlg.i++;tally(true);say(o.en);setTimeout(()=>{if(!dlg)return;dlg.busy=false;advanceDlg();render();if(dlg&&dlg.speak){const s=dlg.speak;dlg.speak=null;setTimeout(()=>say(s),900)}},350)}
    else{if(b.classList.contains("wrong"))return;b.classList.add("wrong");dlg.miss++;tally(false);const fb=$("#dfb");fb.className="fb no";fb.textContent=o.fb}});
  if(dlg.speak){const s=dlg.speak;dlg.speak=null;say(s)}
  const chat=stage.querySelector(".chat");if(chat&&chat.lastElementChild)chat.lastElementChild.scrollIntoView({block:"nearest"});
}
function rRev(){
  if(!rev)rev={q:shuffle(due()),i:0,ok:0,cur:null};
  if(!rev.q.length){stage.innerHTML=subsHtml()+`<div class="card"><span class="label">Repaso inteligente</span><p class="q">Nada que repasar por ahora.</p><p class="es">Cada cosa que aprendes vuelve aquí justo antes de que se te olvide: al día siguiente, a los 2 días, a los 4, a los 8…</p><button class="btn primary" id="rl">Aprender algo nuevo</button></div>`;on("rl",()=>goSub("aprender","frases"));return}
  if(rev.i>=rev.q.length){stage.innerHTML=subsHtml()+`<div class="card"><span class="label">Repaso terminado</span><p class="q">Acertaste ${rev.ok} de ${rev.q.length}.</p><p class="es">Lo que fallaste vuelve mañana. Lo que acertaste, más adelante.</p><div class="row"><button class="btn" id="rh">Volver a Hoy</button><button class="btn primary" id="rm">Repasar otra vez</button></div></div>`;
    on("rh",()=>goSub("hoy"));on("rm",()=>{rev=null;render()});return}
  if(!rev.cur)rev.cur=qFor(rev.q[rev.i]);const q=rev.cur;
  mc({...q,head:subsHtml(),label:q.label,right:`${rev.i+1} / ${rev.q.length}`,onAnswer:ok=>{if(ok)rev.ok++;grade(q.k,ok);if(q.k[0]!=="r"||!q.play)say(q.say)},next:()=>{rev.i++;rev.cur=null;render()},nextLabel:rev.i+1<rev.q.length?"Siguiente":"Terminar"});
}

/* ---------- Reto ---------- */
function retoQ(){const useP=Math.random()<.5;
  if(useP){const c=pick(P);const others=shuffle(P.filter(p=>p.id!==c.id)).slice(0,3);const opts=shuffle([c,...others]);return {prompt:c.es,opts:opts.map(o=>o.en),correct:opts.indexOf(c)}}
  const c=pick(W);const others=shuffle(W.filter(w=>w.id!==c.id)).slice(0,3);const opts=shuffle([c,...others]);return {prompt:c.es,opts:opts.map(o=>o.en),correct:opts.indexOf(c)}}
function stopReto(){if(reto.timer){clearInterval(reto.timer);reto={phase:"start"}}}
function rReto(){
  if(reto.phase==="start"){stage.innerHTML=`<div class="card tall"><span class="label">Reto de 60 segundos</span><p class="q">¿Cuántas aciertas en un minuto?</p><p class="es">Te damos la frase en español y eliges cómo se dice en inglés. Cada acierto suma un punto y 5 XP.</p><p style="margin:0">Tu récord: <b>${S.best}</b></p><button class="btn primary" id="rgo">Empezar</button></div>`;
    on("rgo",()=>{reto={phase:"play",score:0,end:Date.now()+60000,q:retoQ(),lock:false};reto.timer=setInterval(()=>{const left=Math.max(0,Math.ceil((reto.end-Date.now())/1000));const el=$("#time");if(el)el.textContent=left+" s";if(left<=0)endReto()},250);render()});return}
  if(reto.phase==="end"){const rec=reto.rec;stage.innerHTML=`<div class="card tall"><span class="label">Se acabó el tiempo</span><p class="q">${reto.score} ${reto.score===1?"acierto":"aciertos"}</p><p class="fb ${rec?"good":""}">${rec?"¡Nuevo récord!":`Tu récord sigue en ${S.best}.`}</p><button class="btn primary" id="ragain">Jugar otra vez</button></div>`;
    on("ragain",()=>{reto={phase:"start"};render()});return}
  const q=reto.q;
  stage.innerHTML=`<div class="card"><div class="meta"><span class="time" id="time">${Math.max(0,Math.ceil((reto.end-Date.now())/1000))} s</span><span class="time">${reto.score} pts</span></div><p class="q">${esc(q.prompt)}</p>
   <div class="opts">${q.opts.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("")}</div></div>`;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(reto.lock)return;reto.lock=true;const ok=+b.dataset.i===q.correct;
    b.classList.add(ok?"right":"wrong");if(!ok)stage.querySelectorAll(".opt")[q.correct].classList.add("right");
    if(ok){reto.score++;tally(true,5)}
    setTimeout(()=>{if(reto.phase!=="play")return;reto.q=retoQ();reto.lock=false;render()},ok?250:700)});
}
function endReto(){if(reto.phase!=="play")return;clearInterval(reto.timer);reto.timer=null;reto.phase="end";reto.rec=reto.score>S.best;if(reto.rec)S.best=reto.score;after();if(tab==="reto")render()}

/* ---------- Progreso ---------- */
function bars(list,arr,t){return list.slice(1).map(c=>{const xs=arr.filter(x=>x.cat===c),k=xs.filter(x=>known(t+":"+x.id)).length;
  return `<div><div class="meta" style="color:var(--ink);font-weight:600"><span>${esc(c)}</span><span>${k}/${xs.length}</span></div><div class="bar"><i style="width:${k/xs.length*100}%"></i></div></div>`}).join("")}
function rProg(){
  const L=lvl(),kw=countKnown("w",W),kp=countKnown("p",P),ke=countKnown("e",E),kr=countKnown("r",R);
  const extra=[["Errores típicos",ke,E.length],["Pronunciación",kr,R.length],["Diálogos",S.dlg.length,DLG.length]];
  stage.innerHTML=`<div class="tile"><span class="label">Nivel</span><b class="lv">${L.name}</b><div class="bar"><i style="width:${L.pct}%"></i></div><span class="small">${L.next?`${S.xp} / ${L.next} XP para el siguiente nivel`:`${S.xp} XP · nivel máximo`}</span></div>
   <div class="stats">
    <div class="stat"><b>${streak()}</b><span>días de racha</span></div>
    <div class="stat"><b>${S.best}</b><span>récord del reto</span></div>
    <div class="stat"><b>${kw}/${W.length}</b><span>palabras dominadas</span></div>
    <div class="stat"><b>${kp}/${P.length}</b><span>frases dominadas</span></div>
   </div>
   <span class="label">Insignias · ${S.badges.length}/${BADGES.length}</span>
   <div class="badges">${BADGES.map(([id,name,desc])=>`<div class="bdg ${S.badges.includes(id)?"on":""}">${MEDAL}<b>${name}</b><span>${desc}</span></div>`).join("")}</div>
   <span class="label">Comparte tu progreso</span>
   <div class="card"><p style="margin:0">Crea una imagen con tu racha y tu nivel para subirla a Instagram o WhatsApp.</p><button class="btn primary" id="mkcard">Crear imagen</button><div id="cardprev"></div><p class="fb" id="cfb" aria-live="polite"></p></div>
   <span class="label">Por temas</span>
   <div class="card">${bars(WCATS,W,"w")}</div>
   <div class="card">${bars(PCATS,P,"p")}</div>
   <div class="card">${extra.map(([n,k,t])=>`<div><div class="meta" style="color:var(--ink);font-weight:600"><span>${n}</span><span>${k}/${t}</span></div><div class="bar"><i style="width:${k/t*100}%"></i></div></div>`).join("")}</div>
   <details><summary>Glosario de palabras</summary><div class="list">${W.map(w=>`<div class="li"><span class="dot ${known("w:"+w.id)?"known":""}"></span><span style="flex:1;min-width:0"><b>${esc(w.en)}</b> <span class="es">— ${esc(w.es)}</span></span><button class="speak" data-say="${esc(w.en)}" aria-label="Escuchar ${esc(w.en)}">▶</button></div>`).join("")}</div></details>
   <details><summary>Glosario de frases</summary><div class="list">${P.map(p=>`<div class="li"><span class="dot ${known("p:"+p.id)?"known":""}"></span><span style="flex:1;min-width:0"><b>${esc(p.en)}</b> <span class="es">— ${esc(p.es)}</span></span><button class="speak" data-say="${esc(p.en)}" aria-label="Escuchar">▶</button></div>`).join("")}</div></details>
   <div class="row"><button class="btn bad" id="reset">Reiniciar progreso</button></div><p class="fb" id="rfb"></p>`;
  on("mkcard",makeCard);
  let armed=false;on("reset",e=>{if(!armed){armed=true;e.target.textContent="Toca otra vez para borrar todo";return}S=fresh();save();paintHeader();render();$("#rfb").textContent="Progreso reiniciado."});
}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
async function makeCard(){
  try{await document.fonts.load('800 100px "Bricolage Grotesque"');await document.fonts.load('600 40px "Source Sans 3"')}catch(e){}
  const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");
  const D='"Bricolage Grotesque", sans-serif',B='"Source Sans 3", sans-serif';
  x.fillStyle="#0F1226";x.fillRect(0,0,1080,1350);
  x.save();x.translate(90,90);x.scale(150/280,150/280);x.fillStyle="#FF5A1F";rr(x,0,0,280,280,64);x.fill();
  x.fillStyle="#FFFFFF";x.fill(new Path2D("M90 56 H190 A44 44 0 0 1 234 100 V150 A44 44 0 0 1 190 194 H124 L78 236 L86 194 A44 44 0 0 1 46 150 V100 A44 44 0 0 1 90 56 Z"));
  x.fillStyle="#0F1226";x.fill(new Path2D("M156 74 L104 138 L138 138 L124 180 L180 110 L146 110 Z"));x.restore();
  x.textBaseline="alphabetic";x.font=`800 104px ${D}`;x.fillStyle="#FFFFFF";x.fillText("speak",270,200);const w=x.measureText("speak").width;x.fillStyle="#FF5A1F";x.fillText("azo",270+w,200);
  const st=streak(),L=lvl();
  x.fillStyle="#FF5A1F";x.font=`800 380px ${D}`;x.fillText(String(st),84,690);
  x.fillStyle="#FFFFFF";x.font=`800 76px ${D}`;x.fillText(st===1?"día de racha":"días de racha",90,800);
  x.fillStyle="#C9CCE0";x.font=`600 46px ${B}`;
  x.fillText(`Nivel: ${L.name} · ${S.xp} XP`,90,920);
  x.fillText(`${countKnown("w",W)} palabras y ${countKnown("p",P)} frases dominadas`,90,990);
  x.fillText(`${S.badges.length} insignias · récord del reto: ${S.best}`,90,1060);
  x.fillStyle="#FF5A1F";x.fillRect(90,1160,120,8);
  x.fillStyle="#FFFFFF";x.font=`700 44px ${B}`;x.fillText("El inglés que de verdad se habla.",90,1240);
  const url=c.toDataURL("image/png");
  $("#cardprev").innerHTML=`<img src="${url}" alt="Tarjeta de progreso de Speakazo con tu racha y tu nivel"><div class="row" style="margin-top:10px"><button class="btn primary" id="savecard">Guardar o compartir</button></div>`;
  on("savecard",()=>{const fb=$("#cfb");
    c.toBlob(async blob=>{let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){dl=null}
      if(!dl){fb.className="fb";fb.textContent="Mantén pulsada la imagen para guardarla o compartirla.";return}
      try{await dl.save({filename:"speakazo-progreso.png",data:blob});fb.className="fb good";fb.textContent="Imagen lista para compartir."}
      catch(e){fb.className="fb";fb.textContent=e&&e.code==="declined"?"Guardado cancelado.":"No se pudo guardar aquí. Mantén pulsada la imagen para guardarla."}},"image/png")});
}

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(tab!=="reto")stopReto();
  if(tab==="hoy")rHoy();
  else if(tab==="aprender")({vocab:()=>rCards("w"),frases:()=>rCards("p"),errores:rErr,pron:rPron})[SUB.aprender]();
  else if(tab==="practicar")({repaso:rRev,quiz:rQuiz,completa:rComp,repite:rRep,dictado:rDict,oido:rOido,dialogos:rDlg})[SUB.practicar]();
  else if(tab==="reto")rReto();
  else rProg();
}
checkBadges();save();paintHeader();render();
</script>
