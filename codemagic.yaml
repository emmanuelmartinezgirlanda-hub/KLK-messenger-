# Compilación en la nube con Codemagic (https://codemagic.io), sin necesidad de Mac.
# Pasos de configuración: ver INSTALAR_EN_IPHONE.md

workflows:
  # ---------- iPhone: compila, firma y sube a TestFlight / App Store ----------
  # Necesita: cuenta de Apple Developer y, en Codemagic → Integrations → Developer Portal,
  # la clave de App Store Connect con el nombre "KLK App Store Connect".
  # Se lanza a mano (Start new build → "KLK iOS → TestFlight") o subiendo a la rama testflight
  ios-testflight:
    name: KLK iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # También se lanza solo cuando se sube algo a la rama "testflight" de GitHub
    # (así se puede mandar a TestFlight sin entrar en Codemagic).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'testflight'
          include: true
          source: true
    integrations:
      app_store_connect: codemagic key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.klkapp.klk
      vars:
        # Pon "1" cuando actives "Push Notifications" en el App ID (developer.apple.com)
        KLK_PUSH: "1"
    scripts:
      - name: Preparar carpetas nativas
        script: bash tool/prepare_native.sh
      - name: Tests
        script: flutter test
      - name: Firma de código
        script: xcode-project use-profiles
      - name: Compilar IPA firmada
        script: |
          # KLK_TEST=true: solo estas versiones de prueba enseñan el código de Plus
          # y lo que viene «muy pronto». Para la App Store usa la rama "appstore".
          flutter build ipa --release \
            --build-number=$((PROJECT_BUILD_NUMBER + 10)) \
            --dart-define=KLK_TEST=true \
            --dart-define=KLK_PLUS=true \
            --dart-define=KLK_BUSINESS=true \
            --dart-define=KLK_GENTE=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---------- iPhone para la App Store (sin cosas de prueba) ----------
  # Se lanza subiendo a la rama "appstore". Esta es la versión que se elige en
  # App Store Connect para enviar a revisión.
  ios-appstore:
    name: KLK iOS → App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'appstore'
          include: true
          source: true
    integrations:
      app_store_connect: codemagic key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.klkapp.klk
      vars:
        KLK_PUSH: "1"
    scripts:
      - name: Preparar carpetas nativas
        script: bash tool/prepare_native.sh
      - name: Tests
        script: flutter test
      - name: Firma de código
        script: xcode-project use-profiles
      - name: Compilar IPA firmada
        script: |
          # App Store: Negocios y Mi Gente encendidos. Plus y dinero (recargas,
          # remesas) apagados hasta que tengan compras de Apple y proveedor autorizado.
          flutter build ipa --release \
            --build-number=$((PROJECT_BUILD_NUMBER + 10)) \
            --dart-define=KLK_BUSINESS=true \
            --dart-define=KLK_GENTE=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # ---------- iPhone sin cuenta de pago: IPA sin firmar (ya la hace GitHub) ----------
  ios-ipa-sin-firmar:
    name: KLK iOS (IPA sin firmar)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar carpetas nativas
        script: bash tool/prepare_native.sh
      - name: Tests
        script: flutter test
      - name: Compilar sin firma
        script: flutter build ios --release --no-codesign --dart-define=KLK_SERVER="$KLK_SERVER" --dart-define=KLK_TURN_URL="$KLK_TURN_URL" --dart-define=KLK_TURN_USER="$KLK_TURN_USER" --dart-define=KLK_TURN_PASS="$KLK_TURN_PASS"
      - name: Empaquetar IPA
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr KLK-messenger.ipa Payload
    artifacts:
      - build/ipa/KLK-messenger.ipa

  # ---------- Android: genera un APK instalable ----------
  android-apk:
    name: KLK Android (APK)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
    scripts:
      - name: Preparar carpetas nativas
        script: bash tool/prepare_native.sh
      - name: Tests
        script: flutter test
      - name: Compilar APK
        script: flutter build apk --release --dart-define=KLK_SERVER="$KLK_SERVER" --dart-define=KLK_TURN_URL="$KLK_TURN_URL" --dart-define=KLK_TURN_USER="$KLK_TURN_USER" --dart-define=KLK_TURN_PASS="$KLK_TURN_PASS"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  # ---------- Android: .aab firmado para Google Play ----------
  # Necesita en Codemagic → Teams → Code signing identities → Android keystores
  # una clave llamada "klk_upload" (se puede generar ahí mismo con "Generate keystore").
  android-play:
    name: KLK Android → Google Play (.aab)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - klk_upload
    scripts:
      - name: Preparar carpetas nativas
        script: bash tool/prepare_native.sh
      - name: Tests
        script: flutter test
      - name: Compilar .aab firmado
        script: |
          # Google Play: igual que la App Store (Negocios y Mi Gente; sin Plus,
          # sin dinero y sin opciones de prueba).
          flutter build appbundle --release \
            --build-number=$((BUILD_NUMBER + 10)) \
            --dart-define=KLK_BUSINESS=true \
            --dart-define=KLK_GENTE=true
    artifacts:
      - build/app/outputs/bundle/release/*.aab
